management:
  endpoint:
    health:
      # 开发检查页用组件状态区分 MySQL、Redis 和 Kafka 的连接问题。
      show-components: always

liveflow:
  auth:
    # 仅在回环 HTTP 开发环境显式关闭。HTTPS 开发环境沿用 Secure。
    secure-cookie: ${LIVEFLOW_LOCAL_SECURE_COOKIE:true}
    csrf:
      allowed-origins: ${LIVEFLOW_CSRF_ALLOWED_ORIGINS:${liveflow.local.frontend-origin},http://localhost:5173}
  local:
    # WebSocket 握手允许的页面来源，需与开发前端实际使用的协议、主机和端口一致。
    frontend-origin: ${LIVEFLOW_FRONTEND_ORIGIN:http://127.0.0.1:5173}
  room-messages:
    # 同一台开发机的两个回环地址是不同 Origin，分别加入精确允许清单。
    allowed-origin: ${LIVEFLOW_ROOM_MESSAGES_ALLOWED_ORIGIN:${liveflow.local.frontend-origin},http://localhost:5173}
