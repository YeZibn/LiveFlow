# 本地后端默认只监听回环地址，并使用独立的 18080 端口，减少与其他开发服务的冲突。
server:
  address: ${LIVEFLOW_BIND_ADDRESS:127.0.0.1}
  port: ${LIVEFLOW_PORT:18080}

spring:
  application:
    name: liveflow
  # 后端运行在宿主机，使用 Compose 映射到宿主机的端口连接 MySQL、Redis 和 Kafka。
  datasource:
    url: jdbc:mysql://${LIVEFLOW_MYSQL_HOST:127.0.0.1}:${LIVEFLOW_MYSQL_PORT:13306}/${LIVEFLOW_MYSQL_DATABASE:liveflow}
    username: ${LIVEFLOW_MYSQL_USER:liveflow}
    password: ${LIVEFLOW_MYSQL_PASSWORD:liveflow_dev}
    hikari:
      # 从连接池获取数据库连接最多等待 3 秒，单位为毫秒。
      connection-timeout: 3000
  data:
    redis:
      host: ${LIVEFLOW_REDIS_HOST:127.0.0.1}
      port: ${LIVEFLOW_REDIS_PORT:16379}
      connect-timeout: 2s
      timeout: 2s
  task:
    scheduling:
      pool:
        # 水位、心跳、清理和回执重放各自推进。
        size: 4
  kafka:
    # 可覆盖完整的 broker 地址列表，本地默认连接 Kafka 的 EXTERNAL 监听器。
    bootstrap-servers: ${LIVEFLOW_KAFKA_BOOTSTRAP_SERVERS:127.0.0.1:${LIVEFLOW_KAFKA_PORT:19092}}

# 健康接口用于探活，响应隐藏异常和底层连接信息。
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      show-details: never

liveflow:
  room-messages:
    connection-limit: ${LIVEFLOW_ROOM_MESSAGES_CONNECTION_LIMIT:512}
    # 服务位于反向代理之后时，可显式配置浏览器地址。留空使用同源校验。
    allowed-origin: ${LIVEFLOW_ROOM_MESSAGES_ALLOWED_ORIGIN:}
    v2:
      accepting: ${LIVEFLOW_ROOM_MESSAGES_ACCEPTING:true}
      replication-factor: ${LIVEFLOW_ROOM_MESSAGES_KAFKA_REPLICAS:1}
      min-insync-replicas: ${LIVEFLOW_ROOM_MESSAGES_KAFKA_MIN_ISR:1}
      state-directory: ${LIVEFLOW_ROOM_MESSAGES_STATE_DIRECTORY:/tmp/liveflow-room-streams-v2}
  auth:
    # 使用部署环境注入的 Base64 随机密钥，解码后至少 32 字节。
    signing-key: ${LIVEFLOW_JWT_SIGNING_KEY:}
    secure-cookie: true
    registration-limit:
      # 对字段校验通过的注册请求按来源 IP 计数。
      max-attempts: ${LIVEFLOW_REGISTRATION_MAX_ATTEMPTS:10}
      window-seconds: ${LIVEFLOW_REGISTRATION_WINDOW_SECONDS:600}
