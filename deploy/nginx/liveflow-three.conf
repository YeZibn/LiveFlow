# 安装到 Nginx 的 http 配置目录。宿主机联调时三个后端只监听回环。
map $http_upgrade $liveflow_connection_upgrade {
    default upgrade;
    ''      close;
}

upstream liveflow_backend {
    least_conn;
    server 127.0.0.1:18081 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:18082 max_fails=1 fail_timeout=5s;
    server 127.0.0.1:18083 max_fails=1 fail_timeout=5s;
}

server {
    listen 127.0.0.1:18080;
    root /srv/liveflow/frontend;

    # 覆盖外部提供的地址。后端只信任实际代理来源的这些头。
    proxy_set_header Host $http_host;
    proxy_set_header Forwarded "";
    proxy_set_header X-Forwarded-Host $http_host;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Forwarded-Port $server_port;
    proxy_connect_timeout 2s;

    location /api/ {
        # 连接断开后，发送是否已入队只能看回执，代理禁止重发。
        proxy_next_upstream off;
        proxy_pass http://liveflow_backend;
    }

    location /ws/ {
        proxy_http_version 1.1;
        # 此层重设了代理头，需一并保留服务级来源信息。
        proxy_set_header Host $http_host;
        proxy_set_header Forwarded "";
        proxy_set_header X-Forwarded-Host $http_host;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port $server_port;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $liveflow_connection_upgrade;
        proxy_read_timeout 75s;
        proxy_pass http://liveflow_backend;
    }

    location /actuator/ {
        return 404;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
